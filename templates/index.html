<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HealthGuard AI</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:
    linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)),
    url('https://images.unsplash.com/photo-1588776814546-1ffcf47267a5?q=80&w=1200');
    background-size:cover;
    background-position:center;
    overflow:hidden;
    transition:0.5s;
}

.container{
    width:420px;
    padding:35px;
    border-radius:25px;
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(15px);
    box-shadow:0 8px 32px rgba(0,0,0,0.3);
    color:white;
    animation: float 4s ease-in-out infinite;
}

@keyframes float {

    0%{
        transform: translateY(0px);
    }

    50%{
        transform: translateY(-10px);
    }

    100%{
        transform: translateY(0px);
    }

}

h1{
    text-align:center;
    margin-bottom:10px;
    font-size:32px;
}

.subtitle{
    text-align:center;
    margin-bottom:25px;
    color:#ddd;
    font-size:14px;
}

label{
    font-size:14px;
    display:block;
    margin-bottom:8px;
}

select{
    width:100%;
    padding:12px;
    border:none;
    border-radius:12px;
    margin-bottom:18px;
    outline:none;
    font-size:15px;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    background:linear-gradient(45deg,#00c6ff,#0072ff);
    color:white;
    font-size:16px;
    cursor:pointer;
    transition:0.3s;
    font-weight:bold;
}

button:hover{
    transform:scale(1.03);
}

#result{
    margin-top:25px;
    text-align:center;
    font-size:18px;
    font-weight:600;
    line-height:1.8;
}

.footer{
    text-align:center;
    margin-top:20px;
    font-size:12px;
    color:#ddd;
}

#themeToggle{
    position:absolute;
    top:20px;
    right:20px;
    width:auto;
    padding:10px 15px;
    border:none;
    border-radius:12px;
    background:white;
    color:black;
    font-weight:bold;
    cursor:pointer;
}

.light-mode{
    background:
    linear-gradient(rgba(255,255,255,0.5), rgba(255,255,255,0.5)),
    url('https://images.unsplash.com/photo-1588776814546-1ffcf47267a5?q=80&w=1200');
    background-size:cover;
    background-position:center;
}

.light-mode .container{
    background:rgba(255,255,255,0.8);
    color:black;
}

.light-mode .subtitle{
    color:#333;
}

.light-mode .footer{
    color:#333;
}

.light-mode select{
    background:#f1f1f1;
    color:black;
}

</style>

</head>

<body>

<button id="themeToggle">☀ Light Mode</button>

<div class="container">

    <h1>HealthGuard AI</h1>

    <div class="subtitle">
        AI Powered Disease Prediction System
    </div>

    <form id="predictForm">

        <label>Fever</label>
        <select id="fever" required>
            <option value="">Select</option>
            <option value="1">Yes</option>
            <option value="0">No</option>
        </select>

        <label>Cough</label>
        <select id="cough" required>
            <option value="">Select</option>
            <option value="1">Yes</option>
            <option value="0">No</option>
        </select>

        <label>Fatigue</label>
        <select id="fatigue" required>
            <option value="">Select</option>
            <option value="1">Yes</option>
            <option value="0">No</option>
        </select>

        <label>Difficulty Breathing</label>
        <select id="breathing" required>
            <option value="">Select</option>
            <option value="1">Yes</option>
            <option value="0">No</option>
        </select>

        <button type="submit">
            Predict Disease
        </button>

    </form>

    <div id="result"></div>

    <div class="footer">
        Developed with Flask + Machine Learning
    </div>

</div>

<script>

document.getElementById("predictForm").addEventListener("submit", async function(e){

    e.preventDefault();

    const features = [
        Number(document.getElementById("fever").value),
        Number(document.getElementById("cough").value),
        Number(document.getElementById("fatigue").value),
        Number(document.getElementById("breathing").value)
    ];

    const response = await fetch("/predict", {

        method: "POST",

        headers: {
            "Content-Type": "application/json"
        },

        body: JSON.stringify({
            features: features
        })

    });

    const data = await response.json();

    document.getElementById("result").innerHTML =
    `
    Predicted Disease:<br>
    <span style="color:#00ffcc">${data.result}</span>
    <br><br>

    Confidence Level:<br>
    <span style="color:#ffd369">${data.confidence}%</span>
    `;

});

const toggleBtn = document.getElementById("themeToggle");

toggleBtn.addEventListener("click", () => {

    document.body.classList.toggle("light-mode");

    if(document.body.classList.contains("light-mode")){
        toggleBtn.innerText = "🌙 Dark Mode";
    }
    else{
        toggleBtn.innerText = "☀ Light Mode";
    }

});

</script>

</body>
</html>
